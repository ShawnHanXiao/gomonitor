<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Variant B: 三个闪电大小递增，体现时间跨度层级（5h最小，每月最大） -->
  <!-- 从上至下：5小时 / 每周 / 每月 -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 5小时 (green) 小 -->
  <g filter="url(#shadow)">
    <path d="M32 4 L24 14 L28 14 L26 20 L36 12 L31 12 Z" fill="#3FB950"/>
  </g>

  <!-- 每周 (yellow) 中 -->
  <g filter="url(#shadow)">
    <path d="M32 24 L22 36 L27 36 L25 43 L38 33 L31 33 Z" fill="#E3B341"/>
  </g>

  <!-- 每月 (orange) 大 -->
  <g filter="url(#shadow)">
    <path d="M32 44 L20 58 L26 58 L24 66 L40 54 L31 54 Z" fill="#F0883E"/>
  </g>
</svg>
