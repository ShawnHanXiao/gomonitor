<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>GoMonitor 托盘图标方案预览</title>
<style>
  body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; background:#0d1117; color:#e6edf3; padding:40px; }
  h1 { font-size:20px; margin-bottom:8px; }
  .sub { color:#8b949e; font-size:13px; margin-bottom:32px; }
  .row { display:flex; gap:48px; flex-wrap:wrap; }
  .card { background:#161b22; border:1px solid #30363d; border-radius:12px; padding:24px; width:220px; text-align:center; }
  .card h2 { font-size:15px; margin:0 0 4px; }
  .card .desc { color:#8b949e; font-size:12px; margin-bottom:16px; min-height:32px; }
  .card img { width:96px; height:96px; image-rendering:auto; }
  .legend { margin-top:20px; font-size:12px; color:#8b949e; text-align:left; }
  .legend div { margin:4px 0; }
  .swatch { display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:6px; vertical-align:middle; }
</style>
</head>
<body>
  <h1>GoMonitor 托盘图标 — 三闪电纵向排列方案</h1>
  <div class="sub">从上至下：5小时 / 每周 / 每月 · 颜色定义不变（绿→黄→橙→红→灰）</div>

  <div class="row">
    <div class="card">
      <h2>方案 A</h2>
      <div class="desc">三个独立圆角方块，纵向排列，闪电居中</div>
      <img src="icon-variant-a.svg" alt="方案A">
    </div>
    <div class="card">
      <h2>方案 B</h2>
      <div class="desc">三个闪电大小递增，体现时间跨度层级</div>
      <img src="icon-variant-b.svg" alt="方案B">
    </div>
    <div class="card">
      <h2>方案 C</h2>
      <div class="desc">统一深色圆角容器，闪电等距排列</div>
      <img src="icon-variant-c.svg" alt="方案C">
    </div>
  </div>

  <div class="legend">
    <div><span class="swatch" style="background:#3FB950"></span>5小时用量 &lt; 60%</div>
    <div><span class="swatch" style="background:#E3B341"></span>每周用量 60–80%</div>
    <div><span class="swatch" style="background:#F0883E"></span>每月用量 80–95%</div>
    <div><span class="swatch" style="background:#E5484D"></span>≥95% 红色</div>
    <div><span class="swatch" style="background:#8B949E"></span>错误/无 Key 灰色</div>
  </div>
</body>
</html>
