<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Variant A (revised): 三个独立直角方块，纵向排列，闪电居中，硬朗风格 -->
  <!-- 从上至下：5小时 / 每周 / 每月 -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 5小时 (green) -->
  <g filter="url(#shadow)">
    <rect x="14" y="4" width="36" height="16" fill="#3FB950"/>
    <path d="M30 6 L24 13 L28 13 L26 18 L34 11 L30 11 Z" fill="#ffffff"/>
  </g>

  <!-- 每周 (yellow) -->
  <g filter="url(#shadow)">
    <rect x="14" y="24" width="36" height="16" fill="#E3B341"/>
    <path d="M30 26 L24 33 L28 33 L26 38 L34 31 L30 31 Z" fill="#ffffff"/>
  </g>

  <!-- 每月 (orange) -->
  <g filter="url(#shadow)">
    <rect x="14" y="44" width="36" height="16" fill="#F0883E"/>
    <path d="M30 46 L24 53 L28 53 L26 58 L34 51 L30 51 Z" fill="#ffffff"/>
  </g>
</svg>
