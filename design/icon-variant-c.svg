<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Variant C: 三个闪电置于统一圆角容器内，纵向等距排列 -->
  <!-- 从上至下：5小时 / 每周 / 每月 -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 统一容器 -->
  <rect x="10" y="2" width="44" height="60" rx="10" fill="#1F2430" filter="url(#shadow)"/>

  <!-- 5小时 (green) -->
  <path d="M32 8 L25 17 L29 17 L27 23 L36 16 L31 16 Z" fill="#3FB950"/>

  <!-- 每周 (yellow) -->
  <path d="M32 26 L25 35 L29 35 L27 41 L36 34 L31 34 Z" fill="#E3B341"/>

  <!-- 每月 (orange) -->
  <path d="M32 44 L25 53 L29 53 L27 59 L36 52 L31 52 Z" fill="#F0883E"/>
</svg>
